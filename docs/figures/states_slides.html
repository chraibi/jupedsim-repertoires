<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repertoire and phase transitions</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>Repertoire and phase transitions</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="states-title states-desc">
<title id="states-title">Repertoire and phase transitions</title>
<desc id="states-desc">State machine of one agent: queueing, the two phases of overtaking, return by completion or abandonment, and handoff to the exit journey.</desc>
<defs>

<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M 30 260 L 58 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 240 244 L 388 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 570 244 L 718 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 390 284 L 242 284" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 780 300 L 780 372 Q 780 380 772 380 L 188 380 Q 180 380 180 372 L 180 302" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 840 300 L 840 412 Q 840 420 832 420 L 128 420 Q 120 420 120 412 L 120 302" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 130 220 L 130 168 Q 130 160 138 160 L 162 160 Q 170 160 170 168 L 170 218" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M 900 110 L 922 110" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="279" y="224" width="70" height="12" rx="2" fill="#f5f5f5"/>
<text x="314" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INCENTIVE+GAP</text>
<rect x="607" y="224" width="74" height="12" rx="2" fill="#f5f5f5"/>
<text x="644" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BESIDE THEM</text>
<rect x="294" y="292" width="45" height="12" rx="2" fill="#f5f5f5"/>
<text x="316" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ABANDON</text>
<rect x="455" y="360" width="50" height="12" rx="2" fill="#f5f5f5"/>
<text x="480" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETE</text>
<rect x="458" y="400" width="45" height="12" rx="2" fill="#f5f5f5"/>
<text x="480" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ABANDON</text>
<rect x="125" y="140" width="50" height="12" rx="2" fill="#f5f5f5"/>
<text x="150" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WITHHELD</text>
<circle cx="24" cy="260" r="6" fill="#2d3142"/>
<circle cx="932" cy="110" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/><circle cx="932" cy="110" r="5" fill="#2d3142"/>
<rect x="60" y="220" width="180" height="80" rx="6" fill="#f5f5f5"/>
<rect x="60" y="220" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="150.0" y="258.0" fill="#2d3142" font-size="13" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Queueing</text>
<text x="150.0" y="275.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">standing · advancing</text>
<rect x="390" y="220" width="180" height="80" rx="6" fill="#f5f5f5"/>
<rect x="390" y="220" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480.0" y="258.0" fill="#2d3142" font-size="13" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Step aside</text>
<text x="480.0" y="275.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">overtaking · phase 1</text>
<rect x="720" y="220" width="180" height="80" rx="6" fill="#f5f5f5"/>
<rect x="720" y="220" width="180" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="810.0" y="258.0" fill="#2d3142" font-size="13" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Pass ahead</text>
<text x="810.0" y="275.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">overtaking · phase 2</text>
<rect x="720" y="80" width="180" height="60" rx="6" fill="#f5f5f5"/>
<rect x="720" y="80" width="180" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="810.0" y="108.0" fill="#2d3142" font-size="13" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Exit journey</text>
<text x="810.0" y="125.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">handed off</text>
<text x="700" y="102" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">From any state, once within 1 m</text>
<text x="700" y="122" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">of the entrance and the door is open.</text>
</svg>
    </div>
  </div>
</body>
</html>
