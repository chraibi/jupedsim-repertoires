<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One control interval of the repertoire layer</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Control loop · Diagram Design</p>
    <h1>One control interval of the repertoire layer</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
<title id="loop-title">One control interval of the repertoire layer</title>
<desc id="loop-desc">Perception and memory feed the selector, the active repertoire turns the decision into a target and desired speed, and the operational model moves the agents, whose new positions are perceived at the next interval.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M 180 160 L 268 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 420 160 L 508 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 660 160 L 748 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 825 200 L 825 252 Q 825 260 817 260 L 113 260 Q 105 260 105 252 L 105 202" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 585 120 L 585 68 Q 585 60 593 60 L 748 60" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="199" y="140" width="50" height="12" rx="2" fill="#f5f5f5"/>
<text x="224" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SNAPSHOT</text>
<rect x="434" y="140" width="60" height="12" rx="2" fill="#f5f5f5"/>
<text x="464" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REPERTOIRE</text>
<rect x="667" y="140" width="74" height="12" rx="2" fill="#f5f5f5"/>
<text x="704" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TARGET, SPEED</text>
<rect x="438" y="240" width="55" height="12" rx="2" fill="#f5f5f5"/>
<text x="465" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POSITIONS</text>
<rect x="644" y="40" width="45" height="12" rx="2" fill="#f5f5f5"/>
<text x="666" y="49" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HANDOFF</text>
<rect x="30" y="120" width="150" height="80" rx="6" fill="#f5f5f5"/>
<rect x="30" y="120" width="150" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="105.0" y="158.0" fill="#2d3142" font-size="13" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Perception, memory</text>
<text x="105.0" y="175.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">R = 4 m · ±90°</text>
<rect x="270" y="120" width="150" height="80" rx="6" fill="#f5f5f5"/>
<rect x="270" y="120" width="150" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="345.0" y="158.0" fill="#2d3142" font-size="13" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Selector</text>
<text x="345.0" y="175.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every 2 s + events</text>
<rect x="510" y="120" width="150" height="80" rx="6" fill="#f5f5f5"/>
<rect x="510" y="120" width="150" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="585.0" y="158.0" fill="#2d3142" font-size="13" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Repertoire control</text>
<text x="585.0" y="175.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">queueing · overtaking</text>
<rect x="750" y="120" width="150" height="80" rx="6" fill="#f5f5f5"/>
<rect x="750" y="120" width="150" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="825.0" y="158.0" fill="#2d3142" font-size="13" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Operational model</text>
<text x="825.0" y="175.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CFSM · 10 × 0.01 s</text>
<rect x="750" y="36" width="150" height="48" rx="6" fill="#f5f5f5"/>
<rect x="750" y="36" width="150" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="825.0" y="58.0" fill="#2d3142" font-size="13" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Exit journey</text>
<text x="825.0" y="75.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">JuPedSim routing</text>
</svg>
    </div>
  </div>
</body>
</html>
